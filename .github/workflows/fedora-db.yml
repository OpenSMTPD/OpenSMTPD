name: Fedora (amd64 glibc openssl db)
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Fedora (amd64 glibc openssl db)
      run: docker build . --file ci/docker/Dockerfile.fedora-db --tag opensmtpd:fedora-db
